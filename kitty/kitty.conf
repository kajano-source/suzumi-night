# ═══════════════════════════════════════════════════════════════════════════
#  KITTY · "Suzumi Night"
#  Terminal is $term in Hyprland (SUPER+Return).
# ═══════════════════════════════════════════════════════════════════════════

# ── Font ───────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
symbol_font      Material Symbols Rounded
dpi-awareness    kitty

# ── Window ─────────────────────────────────────────────────────────────────
background_opacity   0.88
confirm_os_window_save 0
app_id               kitty
scrollback_pager     less

# Borderless, rounded by Hyprland's decoration config
window_padding_width 10
remember_window_size  true
initial_window_width  720
initial_window_height 420
term                 xterm-kitty

# ── Shell integration ──────────────────────────────────────────────────────
shell_integration confirm

# ── Cursor ─────────────────────────────────────────────────────────────────
# ⚠ `cursor` is a COLOUR option in kitty, not the style. Writing
#   `cursor beam` makes it try to parse "beam" as a colour and it fails with
#   "Invalid color name: 'beam'". The style option is `cursor_shape`; the
#   colour itself lives in themes/suzumi.conf.
cursor_shape              beam
cursor_beam_thickness     1.4
cursor_blink_interval     0.5
mouse_hide_wait           3.0

# ── Tabs ───────────────────────────────────────────────────────────────────
tab_bar_style     powerline
tab_bar_min_tabs  2
tab_bar_edge      top
tab_bar_style_separator powerline

# ── Scrollback / url handling ──────────────────────────────────────────────
scrollback                   10000
scrollback_lines             10000
url_handler                  default
copy_on_select               yes
strip_ansi_codes             no
mouse_hide_wait              3.0

# ── Bell ───────────────────────────────────────────────────────────────────
bell_interval      0
bell_features      none

# ── Include the colour theme ───────────────────────────────────────────────
include themes/suzumi.conf
