# ═══════════════════════════════════════════════════════════════════════════
#  HYPRIDLE  ·  screen off → lock → suspend
#  Timings are tuned for a laptop that is usually docked at a desk.
# ═══════════════════════════════════════════════════════════════════════════

# Dim the screen very early so the wallpaper stays as a faint backlight.
# This is the "video wallpaper keeps glowing" case: swww is stopped so the
# static image is what you see dimming.
listener {
    timeout = 240
    on-timeout = dimStrength 0.25
}

# Slowly fade to black over 20s instead of a hard cut.
# (Skipped when the animated wallpaper is running, handled in autostart.sh.)
listener {
    timeout = 420
    on-timeout = dimStrength 0.0
}

# Blank + lock.
listener {
    timeout = 480
    on-timeout = lock
}

# Audio nudge: if music is playing, treat the session as "in use" and don't
# lock underneath the user. Requires playerctl.
listener {
    timeout = 900
    on-timeout = suppressPause 0.0
}

# On resume, kill any leftover lock/paper and re-assert the wallpaper.
listener {
    timeout = 900
    on-resume = exec -u $UID hyprctl dispatch execdbus org.freedesktop.Notifications /closeAll
}

# Never suspend while on battery — draining a laptop because you glanced away
# from it is a great way to lose work.
listener {
    timeout = 1800
    on-timeout = exec, sh -c '[[ $(cat /sys/class/power_supply/BAT0/status 2>/dev/null) == Charging ]] && systemctl suspend'
}
