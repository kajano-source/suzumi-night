# ═══════════════════════════════════════════════════════════════════════════
#  HYPRLOCK  ·  "Suzumi Night"
#
#  Verified against hyprlock 0.9.6.
#
#  Options that no longer exist in 0.9.6 and are deliberately NOT used here:
#    general:grace, general:no_fade_in, general:no_fade_out
#    background:saturation
#    input-field:outer_color_empty, input-field:font_color_failed
#    the whole `user_icon` block  (every field was removed in 0.9.6)
#    the whole `shields` block    (every field was removed in 0.9.6)
#      → there are therefore no power buttons on the lock screen.
#        Use SUPER+P for the power menu, or SUP from a terminal.
#
#  Also: pango markup (<b>, <span foreground=...>) is NOT rendered by this
#  build — it shows up literally. All styling below uses the native
#  `color` / `font_size` options instead, which always work.
# ═══════════════════════════════════════════════════════════════════════════

$font = "JetBrainsMono Nerd Font"

# ── General ────────────────────────────────────────────────────────────────
general {
    hide_cursor = true
}

# ── Auth ───────────────────────────────────────────────────────────────────
# Fingerprint first (this laptop has a reader configured), password as
# the fallback.
auth {
    fingerprint {
        enabled = true
        ready_message = Scan fingerprint to unlock
        present_message = Scanning…
        retry_delay = 250
    }
}

# ── Animations ─────────────────────────────────────────────────────────────
animations {
    enabled = true
    bezier = bezier, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 6, bezier
    animation = fadeOut, 1, 6, bezier
    animation = inputFieldDots, 1, 2, bezier
}

# ── Background ─────────────────────────────────────────────────────────────
# A heavily blurred, violet-graded version of the wallpaper. This is the
# actual Suzumi image rather than `path = screenshot` because a live
# screencapture of the lock screen itself can come out black; a known-good
# file always renders. If you would rather see a blurred snapshot of whatever
# you were doing, swap in:
#     path = screenshot
background {
    monitor =
    path = ~/.local/share/hypr-rice/suzumi-4k.jpg
    blur_passes = 4
    blur_size = 8
    noise = 0.015
    contrast = 1.05
    brightness = 0.7
    vibrancy = 0.25
    color = rgba(141023ff)
}

# ── Password field ─────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    inner_color = rgba(14102300)
    outer_color = rgba(f472d0ff) rgba(8b5cf6ff) 45deg
    check_color = rgba(a6e3a1ff) rgba(7ad7f5ff) 45deg
    fail_color  = rgba(f38ba8ff) rgba(f472d0ff) 45deg
    font_color  = rgba(ece3fbff)
    fade_on_empty = false
    rounding = 26
    font_family = $font
    placeholder_text = password
    check_text = welcome back
    fail_text = $PAMFAIL$FPRINTFAIL
    dots_size = 0.36
    dots_spacing = 0.42
    position = 0, 90
    halign = center
    valign = center
}

# ── Time ───────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 108
    font_family = $font
    color = rgba(ece3fbff)
    position = 0, -290
    halign = center
    valign = center
}

# ── Date ───────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    color = rgba(b3a3d6ff)
    position = 0, -222
    halign = center
    valign = center
}

# ── User / host ────────────────────────────────────────────────────────────
# ⚠ `$USER` and `$HOSTNAME` are NOT substituted by hyprlock 0.9.6 (only
#   $TIME, $LAYOUT, $PAMFAIL and $FPRINTFAIL are), so they render as nothing.
#   `date` gives us the same information reliably.
label {
    monitor =
    text = cmd[update:60000] date +"user: %U    host: %N"
    font_size = 15
    font_family = $font
    color = rgba(8878b3cc)
    position = 0, -378
    halign = center
    valign = center
}

# ── Layout indicator (click to cycle) ──────────────────────────────────────
label {
    monitor =
    text = $LAYOUT
    font_size = 20
    font_family = $font
    color = rgba(c9a7f5ff)
    onclick = hyprctl switchxkblayout all next
    position = 0, 150
    halign = center
    valign = center
}

# ── Reminder: how to get back to KDE ───────────────────────────────────────
label {
    monitor =
    text = SUPER+SHIFT+ESC switches to KDE Plasma
    font_size = 14
    font_family = $font
    color = rgba(8878b3aa)
    position = 0, 195
    halign = center
    valign = center
}
